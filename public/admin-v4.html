<!doctype html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>管理後台｜NCKU CCC</title><style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#20372c;background:#f4f1e9}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}.login{min-height:100dvh;display:grid;place-items:center;padding:20px}.login form{width:min(410px,100%);background:#fff;padding:38px;border-radius:24px;box-shadow:0 20px 60px #18392b1c}.mark{width:54px;height:54px;background:#18392b;color:#f1c864;border-radius:15px;display:grid;place-items:center;font-size:28px}.login h1{margin:20px 0 7px}.muted{color:#718078;font-size:14px}.field{display:grid;gap:6px;margin:17px 0}.field input,.field textarea{border:1px solid #d9d7d0;border-radius:10px;padding:12px;outline:none;background:#fff}.field input:focus,.field textarea:focus{border-color:#18392b}.primary{border:0;border-radius:10px;padding:12px 18px;background:#18392b;color:#fff}.login .primary{width:100%;margin-top:8px}.error{color:#b34848;min-height:22px}.shell{display:none;min-height:100vh}.side{position:fixed;width:230px;inset:0 auto 0 0;background:#18392b;color:#fff;padding:24px 18px}.side h2{font-size:17px;margin:5px 10px 30px}.side button{display:flex;width:100%;border:0;background:none;color:#b9c8c0;border-radius:10px;padding:13px 14px;margin:5px 0;text-align:left}.side button.active{background:#f1c864;color:#18392b;font-weight:700}.side .logout{position:absolute;bottom:25px;width:calc(100% - 36px)}main{margin-left:230px;padding:35px 4vw 80px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0}.stat{background:#fff;border-radius:16px;padding:20px}.stat b{font-size:30px;display:block}.panel{display:none}.panel.active{display:block}.modalbg{display:none;position:fixed;inset:0;background:#10291faa;z-index:20;padding:20px;place-items:center}.modalbg.open{display:grid}.modalbox{background:#f4f1e9;border-radius:20px;max-width:720px;width:100%;max-height:90dvh;overflow:auto;padding:5px 20px 20px}.modalclose{float:right;border:0;background:none;font-size:28px}.card{background:#fff;border-radius:18px;padding:24px;margin-top:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.wide{grid-column:1/-1}.check{display:flex;align-items:center;gap:8px;margin:18px 0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.toolbar input{padding:10px 13px;border:1px solid #ddd;border-radius:9px;max-width:300px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:690px}th,td{padding:13px 10px;border-bottom:1px solid #ece9e1;text-align:left;font-size:14px}th{color:#77837c;font-size:12px}.badge{padding:4px 8px;border-radius:12px;background:#e4f1e9;color:#28734d;font-size:11px}.badge.out{background:#f2e5df;color:#a25747}.actions button{border:0;background:none;color:#37614b;padding:5px}.actions .danger{color:#b34848}.settings{max-width:650px}.colors{display:grid;grid-template-columns:1fr 1fr;gap:15px}.colors input{width:100%;height:45px}.toast{position:fixed;right:24px;top:20px;background:#18392b;color:white;padding:13px 20px;border-radius:10px;display:none;z-index:10}
@media(max-width:720px){.side{position:fixed;z-index:5;inset:auto 0 0;width:auto;height:68px;padding:6px;display:flex;justify-content:space-around}.side h2,.side .logout{display:none}.side button{width:auto;display:grid;justify-items:center;padding:8px 14px;font-size:12px;margin:0}.side button::before{content:'•';font-size:18px;line-height:12px}main{margin:0;padding:24px 15px 92px}.top h1{font-size:25px}.top .muted{display:none}.stats{grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{padding:14px 10px}.stat b{font-size:24px}.stat span{font-size:11px}.card{padding:18px;border-radius:15px}.formgrid,.colors{grid-template-columns:1fr}.wide{grid-column:auto}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{max-width:none;width:100%}}
</style></head><body><div class="toast" id="toast"></div><section class="login" id="login"><form id="loginForm"><div class="mark">▤</div><h1>圖書館管理後台</h1><p class="muted">請使用管理員 Email 與密碼登入</p><label class="field">Email<input id="email" type="email" required autocomplete="username"></label><label class="field">密碼<input id="password" type="password" required autocomplete="current-password"></label><div class="error" id="loginError"></div><button type="button" id="forgot" style="border:0;background:none;color:#37614b;padding:6px 0">忘記密碼？</button><button class="primary">登入後台</button><p><a href="/">← 返回圖書館</a></p></form></section>
<section class="shell" id="shell"><aside class="side"><h2>NCKU CCC 管理後台</h2><button data-tab="books" class="active">書籍管理</button><button data-tab="loans">借閱紀錄</button><button data-tab="settings">網站設定</button><button data-tab="team">管理員</button><button data-tab="account">我的密碼</button><button class="logout" id="logout">登出</button></aside><main><header class="top"><div><h1 id="title">書籍管理</h1><span class="muted" id="who"></span></div><a href="/">查看前台 →</a></header><div class="stats"><div class="stat"><b id="bookCount">0</b><span>館藏書籍</span></div><div class="stat"><b id="loanCount">0</b><span>借閱中</span></div><div class="stat"><b id="overdueCount">0</b><span>已逾期</span></div></div>
<section class="panel active" id="books"><div class="toolbar"><h2>全部書籍</h2><button class="primary" id="openAdd">＋ 新增書籍</button></div><div class="modalbg" id="bookModal"><div class="modalbox"><button class="modalclose" type="button">×</button><div class="card"><h2 id="formTitle">新增書籍</h2><form id="bookForm" class="formgrid"><label class="field">書名 *<input name="title" required></label><label class="field">作者<input name="author"></label><label class="field">出版社<input name="publisher"></label><label class="field">頁數<input name="pages" type="number"></label><label class="field">分類<input name="category"></label><label class="field">封面照片<input id="cover" type="file" accept="image/*" capture="environment"></label><label class="field wide">書籍簡介<textarea name="description" rows="3"></textarea></label><label class="check"><input name="featured" type="checkbox">設為推薦書籍</label><label class="check"><input name="is_new" type="checkbox" checked>顯示於最新上架</label><input name="edit_id" type="hidden"><button class="primary wide">新增至書庫</button></form></div></div></div><div class="card"><div class="toolbar"><input id="bookSearch" placeholder="搜尋書名或作者"></div><div class="table-wrap"><table><thead><tr><th>書名</th><th>作者</th><th>分類</th><th>狀態</th><th>推薦</th><th>最新</th><th>借閱次數</th><th>操作</th></tr></thead><tbody id="bookRows"></tbody></table></div></div></section>
<section class="panel" id="loans"><div class="card"><div class="toolbar"><h2>借閱紀錄</h2><input id="loanSearch" placeholder="搜尋姓名或書名"></div><div class="table-wrap"><table><thead><tr><th>書籍</th><th>真實姓名</th><th>暱稱</th><th>借閱日</th><th>到期日</th><th>狀態</th></tr></thead><tbody id="loanRows"></tbody></table></div></div></section>
<section class="panel" id="settings"><form class="card settings" id="settingsForm"><h2>網站外觀與提醒</h2><div class="colors"><label class="field">網站主色<input name="primary_color" type="color"></label><label class="field">強調色<input name="accent_color" type="color"></label></div><label class="field">團契 Logo<input name="logo" type="file" accept="image/*"></label><label class="field">到期前提醒天數<input name="reminder_days" placeholder="例如：3,1"><small class="muted">以逗號分隔，現在建議設定為 3,1</small></label><button class="primary">儲存網站設定</button></form></section><section class="panel" id="team"><div class="card"><h2>新增管理員</h2><p class="muted">新帳號預設密碼為 000000，首次登入後必須更改。</p><form id="adminForm" class="toolbar"><input name="email" type="email" placeholder="管理員 Email" required><button class="primary">新增管理員</button></form></div><div class="card"><h2>管理員名單</h2><div class="table-wrap"><table><thead><tr><th>Email</th><th>權限</th><th>密碼狀態</th><th>操作</th></tr></thead><tbody id="adminRows"></tbody></table></div><h3>待處理的密碼重設</h3><div id="resetRows"></div></div></section>
<section class="panel" id="account"><form class="card settings" id="passwordForm"><h2>更改我的密碼</h2><label class="field">目前密碼<input name="currentPassword" type="password" required></label><label class="field">新密碼<input name="newPassword" type="password" minlength="8" required><small class="muted">至少 8 個字元</small></label><button class="primary">更新密碼</button></form></section></main></section>
<script type="module">const $=s=>document.querySelector(s),toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2400)},req=async(url,opt={})=>{const r=await fetch(url,opt);const x=await r.json();if(!r.ok)throw Error(x.error||'操作失敗');return x};let state={books:[],loans:[],settings:{}};
async function start(){try{const me=await req('/api/admin/me');$('#who').textContent=me.email;$('#login').style.display='none';$('#shell').style.display='block';await load()}catch{}}async function load(){state=await req('/api/admin/dashboard');render()}function render(){renderTeam();const active=state.loans.filter(x=>!x.returnedAt),late=active.filter(x=>new Date(x.dueAt)<new Date());$('#bookCount').textContent=state.books.length;$('#loanCount').textContent=active.length;$('#overdueCount').textContent=late.length;renderBooks();renderLoans();const s=state.settings;$('#settingsForm').primary_color.value=s.primary_color||'#18392b';$('#settingsForm').accent_color.value=s.accent_color||'#f1c864';$('#settingsForm').reminder_days.value=s.reminder_days||'3,1'}
function renderBooks(){const q=$('#bookSearch').value.toLowerCase();$('#bookRows').innerHTML=state.books.filter(b=>(b.title+' '+(b.author||'')).toLowerCase().includes(q)).map(b=>`<tr><td><b>${esc(b.title)}</b></td><td>${esc(b.author||'—')}</td><td>${esc(b.category||'—')}</td><td><span class="badge ${b.available?'':'out'}">${b.available?'可借':'借出'}</span></td><td>${b.featured?'★':'—'}</td><td class="actions"><button data-edit="${b.id}">編輯</button><button class="danger" data-delete="${b.id}">刪除</button></td></tr>`).join('')}
function renderLoans(){const q=$('#loanSearch').value.toLowerCase();$('#loanRows').innerHTML=state.loans.filter(l=>(l.bookTitle+' '+l.fullName+' '+l.nickname).toLowerCase().includes(q)).map(l=>{const late=!l.returnedAt&&new Date(l.dueAt)<new Date();return`<tr><td><b>${esc(l.bookTitle)}</b></td><td>${esc(l.fullName)}</td><td>${esc(l.nickname)}</td><td>${date(l.borrowedAt)}</td><td>${date(l.dueAt)}</td><td><span class="badge ${late?'out':''}">${l.returnedAt?'已歸還':late?'已逾期':'借閱中'}</span></td></tr>`}).join('')}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=x=>new Date(x).toLocaleDateString('zh-TW');async function shrink(file){const b=await createImageBitmap(file),r=Math.min(1,1200/b.width),c=document.createElement('canvas');c.width=b.width*r;c.height=b.height*r;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,'image/webp',.82))}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const me=await req('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});$('#who').textContent=me.email;$('#login').style.display='none';$('#shell').style.display='block';await load()}catch(x){$('#loginError').textContent=x.message}};$('#logout').onclick=async()=>{await req('/api/admin/logout',{method:'POST'});location.reload()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab],.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active');$('#title').textContent=b.textContent});
$('#bookForm').onsubmit=async e=>{e.preventDefault();const form=e.target,id=form.edit_id.value;try{if(id){const x=Object.fromEntries(new FormData(form));x.featured=form.featured.checked;x.is_new=form.is_new.checked;await req('/api/admin/books/'+id,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(x)});toast('書籍更新完成')}else{const f=new FormData(form),pic=$('#cover').files[0];f.set('featured',f.has('featured')?'true':'false');f.set('is_new',f.has('is_new')?'true':'false');if(pic)f.set('cover',await shrink(pic),'cover.webp');await req('/api/admin/books',{method:'POST',body:f});toast('書籍新增完成')}form.reset();$('#bookModal').classList.remove('open');await load()}catch(x){toast(x.message)}};$('#bookSearch').oninput=renderBooks;$('#loanSearch').oninput=renderLoans;
$('#bookRows').onclick=async e=>{const id=e.target.dataset.delete||e.target.dataset.edit;if(!id)return;const b=state.books.find(x=>x.id===id);if(e.target.dataset.delete){if(!confirm(`確定刪除《${b.title}》？`))return;await req('/api/admin/books/'+id,{method:'DELETE'});toast('書籍已刪除');await load();return}const f=$('#bookForm');for(const k of ['title','author','publisher','pages','category','description'])f.elements[k].value=b[k]||'';f.featured.checked=!!b.featured;f.is_new.checked=!!b.is_new;f.edit_id.value=b.id;$('#formTitle').textContent='編輯書籍';$('#bookModal').classList.add('open')};
$('#settingsForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),pic=f.get('logo');if(pic?.size)f.set('logo',await shrink(pic),'logo.webp');else f.delete('logo');await req('/api/admin/settings',{method:'POST',body:f});toast('設定已儲存');await load()};function renderTeam(){const admins=state.admins||[],resets=state.resets||[];$('#adminRows').innerHTML=admins.map(a=>`<tr><td><b>${esc(a.email)}</b></td><td>${a.role==='superadmin'?'最高管理員':'管理員'}</td><td>${a.mustChange?'需更改':'正常'}</td><td class="actions">${a.role==='superadmin'?'不可刪除':`<button class="danger" data-admin-delete="${esc(a.email)}">刪除</button>`}</td></tr>`).join('');$('#resetRows').innerHTML=resets.length?resets.map(r=>`<p>${esc(r.email)} <button class="primary" data-reset="${r.id}">重設為 000000</button></p>`).join(''):'<p class="muted">目前沒有待處理申請</p>'}
$('#forgot').onclick=async()=>{const email=$('#email').value.trim();if(!email){$('#loginError').textContent='請先輸入 Email';return}const x=await req('/api/admin/forgot',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email})});$('#loginError').textContent=x.message};
$('#adminForm').onsubmit=async e=>{e.preventDefault();try{await req('/api/admin/admins',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:e.target.email.value})});e.target.reset();toast('管理員已新增，預設密碼 000000');await load()}catch(x){toast(x.message)}};
$('#adminRows').onclick=async e=>{const email=e.target.dataset.adminDelete;if(!email)return;if(!confirm(`確定停用 ${email}？`))return;await req('/api/admin/admins/'+encodeURIComponent(email),{method:'DELETE'});toast('管理員已停用');await load()};$('#resetRows').onclick=async e=>{const id=e.target.dataset.reset;if(!id)return;await req('/api/admin/resets/'+id,{method:'POST'});toast('密碼已重設為 000000');await load()};
$('#passwordForm').onsubmit=async e=>{e.preventDefault();try{await req('/api/admin/change-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();toast('密碼已更新')}catch(x){toast(x.message)}};start();</script><script>const modal=document.querySelector('#bookModal'),form=document.querySelector('#bookForm');document.querySelector('#openAdd').onclick=()=>{form.reset();form.is_new.checked=true;form.edit_id.value='';document.querySelector('#formTitle').textContent='新增書籍';modal.classList.add('open')};document.querySelector('.modalclose').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};</script></body></html>
