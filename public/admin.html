<!doctype html><html lang="zh-TW"><meta name="viewport" content="width=device-width"><title>管理員｜NCKU CCC Library</title><style>body{font:16px system-ui;background:#f7f4ed;color:#18392b;max-width:720px;margin:40px auto;padding:20px}form{display:grid;gap:14px;background:white;padding:28px;border-radius:18px}input,textarea,button{font:inherit;padding:12px;border:1px solid #d5d0c7;border-radius:9px}button{background:#18392b;color:white}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}small{color:#68776e}a{color:#18392b}</style><a href="/">← 返回圖書館</a><h1>管理員新增書籍</h1><p>只有書名必填；照片會在你的裝置先壓縮為 WebP 再上傳。</p><form id="f"><input id="token" type="password" placeholder="管理員密碼" required><input name="title" placeholder="書名（必填）" required><div class="row"><input name="author" placeholder="作者"><input name="publisher" placeholder="出版社"></div><div class="row"><input name="pages" type="number" placeholder="頁數"><input name="category" placeholder="分類"></div><textarea name="description" placeholder="書籍簡介" rows="5"></textarea><label><input name="featured" type="checkbox"> 設為推薦書籍</label><label>封面照片 <input id="cover" type="file" accept="image/*" capture="environment"></label><small id="status"></small><button>新增書籍</button></form><script type="module">const f=document.querySelector('#f'),s=document.querySelector('#status');async function shrink(file){const b=await createImageBitmap(file),m=1200,c=document.createElement('canvas'),r=Math.min(1,m/b.width);c.width=b.width*r;c.height=b.height*r;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,'image/webp',.8))}f.onsubmit=async e=>{e.preventDefault();s.textContent='處理中…';const d=new FormData(f),file=document.querySelector('#cover').files[0];d.set('featured',d.has('featured')?'true':'false');if(file)d.set('cover',await shrink(file),'cover.webp');const r=await fetch('/api/admin/books',{method:'POST',headers:{authorization:'Bearer '+document.querySelector('#token').value},body:d});const x=await r.json();s.textContent=r.ok?'新增完成！':x.error};</script></html>
